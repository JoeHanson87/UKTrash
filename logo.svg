<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Wheelie bin body -->
  <path d="M90 240 h320 v10 a10 10 0 0 1 -10 10 h-300 a10 10 0 0 1 -10 -10 z" fill="#1a1a1a"/>
  <rect x="120" y="255" width="260" height="150" rx="10" ry="10" stroke="#1a1a1a" stroke-width="12" fill="none"/>

  <!-- Bin wheels -->
  <rect x="135" y="405" width="35" height="45" rx="17" ry="17" stroke="#1a1a1a" stroke-width="12" fill="none"/>
  <rect x="195" y="405" width="35" height="45" rx="17" ry="17" stroke="#1a1a1a" stroke-width="12" fill="none"/>
  <rect x="270" y="405" width="35" height="45" rx="17" ry="17" stroke="#1a1a1a" stroke-width="12" fill="none"/>
  <rect x="330" y="405" width="35" height="45" rx="17" ry="17" stroke="#1a1a1a" stroke-width="12" fill="none"/>

  <!-- Bin lid -->
  <rect x="100" y="190" width="300" height="45" rx="12" ry="12" stroke="#1a1a1a" stroke-width="12" fill="none"/>
  <rect x="120" y="155" width="260" height="40" rx="10" ry="10" stroke="#1a1a1a" stroke-width="12" fill="none"/>
  <rect x="170" y="135" width="160" height="25" rx="10" ry="10" stroke="#1a1a1a" stroke-width="12" fill="none"/>

  <!-- Lid hinges -->
  <path d="M150 155 v-20 a15 15 0 0 1 15 -15 h0 a15 15 0 0 1 15 15 v20" stroke="#1a1a1a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M320 155 v-20 a15 15 0 0 1 15 -15 h0 a15 15 0 0 1 15 15 v20" stroke="#1a1a1a" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Website label on bin -->
  <text x="250" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#1a1a1a">www.uktrash.com</text>

  <!-- Main UK TRASH text -->
  <text x="250" y="335" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="74" fill="#1a1a1a">UK TRASH</text>

  <!-- & Jet Washing -->
  <text x="250" y="380" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="32" fill="#1a1a1a">&amp; JET WASHING</text>

  <!-- Tel -->
  <text x="250" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#1a1a1a">Tel: 0333 577 1383</text>
</svg>
